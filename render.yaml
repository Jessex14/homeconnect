services:
  - type: web
    name: homeconnect
    runtime: python
    plan: 0.5c-512mb
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    preDeployCommand: python manage.py migrate
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health/ready
    disk:
      name: homeconnect-media
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: homeconnect-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: homeconnect.onrender.com
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: PRIVATE_MEDIA_ROOT
        value: /var/data/private_media
      - key: MPESA_ALLOW_PRODUCTION
        value: "false"

databases:
  - name: homeconnect-db
    databaseName: homeconnect
    user: homeconnect
    plan: 0.1c-256mb
    region: singapore
    diskSizeGB: 1
